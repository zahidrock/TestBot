name: Auto Update IPTV Playlist

on:
  schedule:
    # Protidin 12 ghonta por por cholbe
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deep Source Discovery (ETag & Rate-Limit Safe)
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "etag_cache.json" ]; then
            size_bytes=$(wc -c < "etag_cache.json" || echo 0)
            if [ "$size_bytes" -gt 5242880 ]; then
              echo "Oversized etag_cache.json detected (${size_bytes} bytes), resetting..."
              rm -f etag_cache.json
            fi
          fi
          if [ ! -f "check_checkpoint.json" ]; then
            python discover_sources.py
          else
            echo "Checkpoint paoa gese! Age baki channel check resume kora hocche..."
          fi

      - name: Run High-Speed IPTV Updater (With Auto-Pause & Resume)
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN || secrets.GITHUB_TOKEN }}
          MAX_RUNTIME_SECONDS: "8400"
        run: |
          python auto_update.py

      - name: Sync & Verify Custom Playlist After Full Scan
        run: |
          if [ ! -f "check_checkpoint.json" ]; then
            python prune_playlist.py
          else
            echo "Full scan ekhono checkpoint-e paused ache; full scan sesh hole custom playlist sync hobe."
          fi

      - name: Commit and Push Updated Playlist & Checkpoints
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          find . -maxdepth 3 -type f -size +50M -not -path './.git/*' -delete || true
          git add -A
          if git diff --staged --quiet; then
            echo "Kono notun change nai."
          else
            if [ -f "check_checkpoint.json" ]; then
              git commit -m "chore: save IPTV check progress checkpoint (auto-paused)"
            else
              git commit -m "chore: update high-speed logo-free IPTV playlists"
            fi
            git pull --rebase origin main || true
            git push
          fi
