name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'   # Proti 6 ghonta porpor cholbe (00, 06, 12, 18 UTC)
  workflow_dispatch:        # Manual run korar option

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover GitHub Bots & Upstream Sources (Once every 24h at 18:00 UTC / 12 AM BD)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *' && startsWith(github.event.repository.updated_at, '') == false
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "18" ] || [ "$HOUR" = "19" ]; then
            python discover_sources.py
          else
            echo "Skipping 24h bot discovery (Current UTC hour: $HOUR)"
          fi

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "18" ] || [ "$HOUR" = "19" ]; then
            export RUN_GH_SEARCH="true"
          else
            export RUN_GH_SEARCH="false"
          fi
          python auto_update.py

      - name: Commit playlist & reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in playlist.m3u playlist_clean.m3u discovered_sources.json bot_report.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "Auto update playlists & sources: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push origin main
          fi
