name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'   # Proti 6 ghonta porpor cholbe
  workflow_dispatch:        # Manual run korar option

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check 24h Search Timer
        id: timer
        run: |
          NOW=$(date +%s)
          LAST=0
          if [ -f "last_search.txt" ]; then
            LAST=$(cat last_search.txt | tr -d '[:space:]')
          fi
          DIFF=$((NOW - LAST))
          # 23 ghonta (82800 sec) par hole ba manual run korle search cholbe
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$DIFF" -ge 82800 ]; then
            echo "run_search=true" >> $GITHUB_OUTPUT
          else
            echo "run_search=false" >> $GITHUB_OUTPUT
          fi

      - name: Discover GitHub Bots & Upstream Sources
        if: steps.timer.outputs.run_search == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: python discover_sources.py

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN }}
          RUN_GH_SEARCH: ${{ steps.timer.outputs.run_search }}
        run: |
          python auto_update.py
          if [ "${{ steps.timer.outputs.run_search }}" = "true" ]; then
            date +%s > last_search.txt
          fi

      - name: Commit playlist & reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in playlist.m3u playlist_clean.m3u discovered_sources.json bot_report.txt last_search.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "Auto update playlists & sources: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push origin main
          fi
