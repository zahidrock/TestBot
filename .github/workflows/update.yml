name: Auto Update IPTV Playlist

on:
  schedule:
    # Protidin 6 ghonta por por cholbe
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    # GitHub Actions er time limit 3 ghonta (180 minutes) kora holo jeno cancel na hoy
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deep Source Discovery (ETag & Rate-Limit Safe)
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Jodi checkpoint baki thake tahole notun discovery skip kore age baki check sesh korbe
          if [ ! -f "check_checkpoint.json" ]; then
            python discover_sources.py
          else
            echo "Checkpoint paoa gese! Age baki channel check resume kora hocche..."
          fi

      - name: Run High-Speed IPTV Updater (With Auto-Pause & Resume)
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN || secrets.GITHUB_TOKEN }}
          # 140 minutes (8400s) por nijer theke cleanly pause niye checkpoint save korbe
          MAX_RUNTIME_SECONDS: "8400"
        run: |
          python auto_update.py

      - name: Commit and Push Updated Playlist & Checkpoints
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "Kono notun change nai."
          else
            if [ -f "check_checkpoint.json" ]; then
              git commit -m "chore: save IPTV check progress checkpoint (auto-paused)"
            else
              git commit -m "chore: update high-speed logo-free IPTV playlists"
            fi
            git pull --rebase origin main || true
            git push
          fi
