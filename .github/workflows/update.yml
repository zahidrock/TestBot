name: Update IPTV Playlist

on:
  schedule:
    - cron: "17 21 * * *"    # প্রতিদিন বাংলাদেশ সময় রাত ৩:১৭ মিনিটে চলবে
  workflow_dispatch:

concurrency:
  group: iptv-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: python auto_update.py
      - name: Commit playlist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u || true
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%F)"
          git push || true
