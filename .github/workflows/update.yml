name: Update IPTV Playlist

on:
  schedule:
    - cron: "17 21 * * *"    # UTC 21:17 = BD time raat 3:17
    - cron: "43 23 * * *"    # UTC 23:43 = BD time bhor 5:43 (backup, jodi uporta GitHub bad dey)
  workflow_dispatch:

concurrency:
  group: iptv-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python auto_update.py
      - name: Commit playlist and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u || true
          git add priority_report.txt || true
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%F)"
          git push || true
